<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1e2b">
  <meta name="description" content="A simple, customizable hockey game stats tracker for volunteer teams.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>ShiftSheet — Hockey stats</title>
  <style>
    :root{--navy:#0b1e2b;--ink:#142b38;--muted:#71808a;--paper:#f5f7f6;--line:#e2e8e6;--teal:#0f8b79;--mint:#d9f1e9;--orange:#f2a35d;--white:#fff;--red:#b74242;--shadow:0 12px 36px #10263012;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding-bottom:86px}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1050px;margin:auto;padding:0 20px}.top{background:var(--navy);color:white;padding:18px 0 0;position:sticky;top:0;z-index:5;box-shadow:0 4px 20px #10263016}.toprow{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px}.brand{display:flex;gap:11px;align-items:center}.mark{width:38px;height:38px;border-radius:12px;background:var(--teal);display:grid;place-items:center;font-size:20px}.brand b{font-size:18px;letter-spacing:-.3px}.brand small{display:block;color:#a8b8be;font-size:11px;margin-top:2px}.team-label{font-size:12px;color:#c5d0d4;background:#ffffff12;border:1px solid #ffffff20;border-radius:20px;padding:8px 12px;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs{display:flex;gap:22px;overflow:auto;scrollbar-width:none}.tabs button{color:#9eafb6;background:none;border:0;border-bottom:3px solid transparent;padding:12px 1px 11px;font-weight:600;font-size:13px;white-space:nowrap}.tabs button.active{color:white;border-bottom-color:#39c8a5}.main{padding:22px 0 30px}.view{display:none}.view.active{display:block}.heading{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin:4px 0 20px}.heading h1{font-size:24px;letter-spacing:-.7px;margin:0 0 5px}.heading p{color:var(--muted);margin:0;font-size:14px;line-height:1.45}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.card h2{font-size:15px;margin:0 0 14px}.btn{background:var(--teal);color:white;border:0;border-radius:11px;padding:11px 15px;font-size:13px;font-weight:700}.btn.secondary{background:#e8f3ef;color:#156d60}.btn.ghost{background:#f0f3f2;color:#354852}.btn.danger{background:#fff0ed;color:var(--red)}.btn.small{padding:8px 11px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:11px;font-weight:700;color:#64747c;text-transform:uppercase;letter-spacing:.06em}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;outline:none;color:var(--ink)}.field input:focus,.field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0f8b791a}.empty{color:var(--muted);font-size:14px;text-align:center;padding:25px 10px}.scorecard{background:linear-gradient(135deg,#0b1e2b,#183748);color:white;border-radius:20px;padding:20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:14px;box-shadow:var(--shadow)}.score-side{text-align:center}.score-side strong{display:block;font-size:13px;color:#bfd0d4;margin-bottom:9px}.score-side b{font-size:35px;letter-spacing:-1px}.score-mid{font-size:12px;color:#90a7ae;text-align:center}.score-mid b{display:block;color:#b8cbc9;font-size:14px;margin-bottom:8px}.setup-card{max-width:620px;margin:10px auto 0}.active-event{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f2f7f5;border-radius:12px;padding:10px 13px;margin-bottom:12px}.active-event span{font-size:12px;color:var(--muted)}.active-event b{font-size:14px}.event-pills{display:flex;gap:8px;overflow:auto;padding:2px 1px 10px;scrollbar-width:thin}.event-pill{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:white;color:#49606a;padding:9px 12px;font-size:12px;font-weight:650}.event-pill.selected{background:var(--mint);border-color:#74cbb6;color:#116b5a}.player-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.player-tile{min-height:75px;background:white;border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ink);box-shadow:0 3px 10px #10263008}.player-tile:active{transform:scale(.97)}.jersey{font-size:18px;font-weight:800;color:var(--teal)}.player-tile small{font-size:11px;max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.recent{display:flex;flex-direction:column;gap:0}.event-row{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}.event-row:first-child{border-top:0}.event-time{font-size:11px;color:#829097}.event-name{font-size:13px;font-weight:700}.event-detail{font-size:11px;color:var(--muted);margin-top:3px}.iconbtn{border:0;background:#f1f3f2;color:#65757d;border-radius:8px;padding:7px 9px;font-size:12px}.subhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.subhead h2{font-size:15px;margin:0}.roster-row,.config-row,.game-row{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:12px 0}.roster-row:first-child,.config-row:first-child,.game-row:first-child{border-top:0}.roster-row .jersey{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#e9f5f1}.roster-name{flex:1;font-size:14px;font-weight:700}.muted{color:var(--muted);font-size:12px}.config-row .config-name,.game-row .game-title{flex:1;font-weight:650;font-size:13px}.toggle{appearance:none;width:42px;height:25px;border-radius:20px;background:#cbd3d2;position:relative;cursor:pointer;transition:.15s;flex:none}.toggle:checked{background:var(--teal)}.toggle:after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:white;left:3px;top:3px;transition:.15s;box-shadow:0 1px 3px #0003}.toggle:checked:after{left:20px}.stats-table{width:100%;border-collapse:collapse;font-size:12px}.stats-table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:9px 6px;border-bottom:1px solid var(--line)}.stats-table td{padding:11px 6px;border-bottom:1px solid #edf0ef}.stats-table th:not(:first-child),.stats-table td:not(:first-child){text-align:center}.scroll-x{overflow:auto}.notice{color:var(--muted);font-size:12px;line-height:1.5;background:#f1f5f3;border-radius:11px;padding:12px;margin-top:12px}.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,15px);background:var(--navy);color:white;padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:10;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:none;z-index:6}.bottomnav .tabs{justify-content:space-around;gap:4px}.bottomnav .tabs button{color:#71808a;padding:8px 4px 6px;font-size:10px}.bottomnav .tabs button.active{color:var(--teal);border:0}.bottomnav .navico{display:block;font-size:18px;margin-bottom:3px}
    @media(max-width:650px){body{padding-bottom:80px}.shell{padding-left:15px;padding-right:15px}.top{position:sticky}.toprow{padding-bottom:11px}.tabs.desktop{display:none}.bottomnav{display:block}.heading h1{font-size:22px}.card{padding:15px;border-radius:15px}.scorecard{padding:17px 12px}.score-side b{font-size:31px}.score-side strong{font-size:11px}.player-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.event-pill{padding:9px 11px}.main{padding-top:18px}.card h2{margin-bottom:12px}}
    .export-actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.export-actions .btn{white-space:nowrap}#printReport{display:none}
    @media print{@page{margin:16mm}body{background:#fff;padding:0;color:#142b38}body>*:not(#printReport){display:none!important}#printReport{display:block!important;font-family:Arial,sans-serif;font-size:10pt;color:#142b38}#printReport h1{font-size:22pt;margin:0 0 4px}#printReport h2{font-size:14pt;margin:20px 0 8px;break-after:avoid}#printReport .report-meta{color:#5d6e76;margin:0 0 20px}#printReport table{border-collapse:collapse;width:100%;font-size:9pt;break-inside:auto}#printReport th,#printReport td{border:1px solid #d7dfdc;padding:6px;text-align:left}#printReport th{background:#eaf2ef}#printReport tr{break-inside:avoid}#printReport .report-foot{margin-top:18px;color:#687a80;font-size:8pt}}
  </style>
</head>
<body>
  <header class="top"><div class="shell"><div class="toprow"><div class="brand"><div class="mark">🏒</div><div><b>ShiftSheet</b><small>Hockey stats, made simple</small></div></div><div class="team-label" id="teamLabel">Your team</div></div><nav class="tabs desktop" id="topTabs"></nav></div></header>
  <main class="shell main">
    <section class="view active" id="view-game"></section>
    <section class="view" id="view-roster"></section>
    <section class="view" id="view-events"></section>
    <section class="view" id="view-stats"></section>
    <section class="view" id="view-games"></section>
  </main>
  <div class="bottomnav"><nav class="tabs" id="bottomTabs"></nav></div>
  <div class="toast" id="toast"></div>
  <div id="printReport"></div>
  <script src="app.js"></script>
</body>
</html>
